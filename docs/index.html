<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>UTC 2027 — Live Standings</title>
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UTC 2027">
<meta name="description" content="Live standings, stats and sledging for the UTC 2027 draft comp.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0B1220;--bg2:#0e1626;--panel:#121A2B;--panel2:#162034;--line:#243050;
  --ink:#EEF2F7;--mute:#8A94A8;--amber:#FFC21A;--green:#3DD98B;--red:#FF5A4E;--blue:#5AA9FF;
  --nav:72px;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(var(--nav) + var(--sb));-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
/* ---------- app chrome ---------- */
header{position:sticky;top:0;z-index:20;padding:calc(var(--st) + 12px) 16px 10px;
  background:rgba(11,18,32,.82);backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:21px;font-weight:800;color:var(--amber);letter-spacing:.02em;flex:1}
.sub{color:var(--mute);font-size:12px;margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:0 0 auto}
.dot.off{background:var(--red)}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);display:grid;place-items:center;font-size:15px;flex:0 0 auto;cursor:pointer}
.iconbtn:active{transform:scale(.92)}
main{max-width:760px;margin:0 auto;padding:12px 12px 24px}
/* translateZ pins the bar to its own compositing layer — without it, iOS Safari lets a
   fixed element with backdrop-filter drift off the bottom edge during scrolling */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;transform:translateZ(0);
  padding-bottom:var(--sb);background:rgba(11,18,32,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:10.5px;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase;padding:10px 2px 12px;display:grid;gap:3px;justify-items:center;cursor:pointer}
nav button .ic{font-size:19px;line-height:1}
nav button.on{color:var(--amber)}
@media (max-width:400px){nav button{font-size:9px;letter-spacing:.01em;padding-left:1px;padding-right:1px}}
/* ---------- building blocks ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;
  animation:rise .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.h{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:10px}
.lbl{font-size:12px;color:var(--mute)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.pos{width:26px;font-weight:800;color:var(--amber);font-variant-numeric:tabular-nums;flex:0 0 auto}
.grow{flex:1;min-width:0}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.mv{font-size:11px;font-weight:700;width:30px;text-align:right;flex:0 0 auto}
.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--mute)}
.bar{height:6px;border-radius:4px;background:#0d1526;overflow:hidden;display:flex;margin-top:6px}
.bar i{display:block;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-size:11px;padding:4px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.chip.live{color:var(--green);border-color:rgba(61,217,139,.35)}
.chip.final{color:var(--amber);border-color:rgba(255,194,26,.35)}
.reax{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.rx{font-size:12px;line-height:1;padding:4px 7px;border-radius:999px;background:var(--panel2);
  border:1px solid var(--line);color:var(--mute);opacity:.4;display:inline-flex;gap:4px;align-items:center}
.rx.has{opacity:1}
.rx.on{opacity:1;color:var(--amber);border-color:rgba(255,194,26,.35)}
.rx i{font-style:normal;font-size:11px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.tiles.four{grid-template-columns:repeat(2,1fr)}
@media (min-width:520px){.tiles.four{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile b{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-bottom:2px}
.tile span{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
.dr{width:24px;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
svg.chart{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--mute);margin-top:10px}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;background:var(--panel);color:var(--mute);border:1px solid var(--line);
  border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--amber);color:#111;border-color:var(--amber);font-weight:700}
.av{position:relative;display:inline-grid;place-items:center;flex:0 0 auto;border-radius:50%;
  background:var(--panel2);border:1px solid var(--line);color:var(--amber);font-weight:800;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.s{width:36px;height:36px;font-size:13px}
.av.m{width:46px;height:46px;font-size:15px}
.av.l{width:84px;height:84px;font-size:27px;border-width:2px}
.tap{cursor:pointer;transition:background .15s}
.tap:active{background:var(--panel2)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;margin-bottom:10px;cursor:pointer}
input.search,textarea.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  color:var(--ink);font:inherit;padding:11px 13px;margin-bottom:10px}
input.search::placeholder,textarea.search::placeholder{color:var(--mute)}
textarea.search{resize:none;display:block;background:var(--panel2)}
.btn{width:100%;background:var(--amber);color:#111;border:0;border-radius:12px;padding:11px 16px;
  font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.55}
button.chip{cursor:pointer;font:inherit;font-size:11px}
nav button{position:relative}
.ndot{position:absolute;top:7px;left:calc(50% + 10px);width:7px;height:7px;border-radius:50%;background:var(--red)}
.big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.spark{width:100%;height:44px;display:block}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--sb) + 16px);transform:translateX(-50%);
  background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13px;
  z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--panel2),var(--line),var(--panel2));
  background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
@media (min-width:720px){.tiles{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}}
</style></head><body>

<header>
  <div class="hrow">
    <h1>UTC 2027</h1>
    <button class="iconbtn" id="share" title="Share">⤴</button>
    <button class="iconbtn" id="refresh" title="Refresh">⟳</button>
  </div>
  <div class="sub" id="sub"><span class="dot"></span><span>loading…</span></div>
</header>

<main id="view"><div class="card"><div class="skel" style="width:60%"></div>
<div class="skel" style="width:85%;margin-top:10px"></div>
<div class="skel" style="width:40%;margin-top:10px"></div></div></main>

<nav>
  <button data-go="ladder"><span class="ic">🏆</span>Ladder</button>
  <button data-go="banter"><span class="ic">💬</span>Banter</button>
  <button data-go="demerits"><span class="ic">🤡</span>Demerits</button>
  <button data-go="stats"><span class="ic">📊</span>Stats</button>
  <button data-go="fix"><span class="ic">📅</span>Fixtures</button>
  <button data-go="comps"><span class="ic">🗂</span>Comps</button>
  <button data-go="me"><span class="ic">👤</span>Drafters</button>
</nav>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $=i=>document.getElementById(i), V=()=>$("view");
const slug=n=>String(n).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const initials=n=>String(n).split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
// the <img> sits over the initials; if there's no photo for someone it removes itself
const avatar=(n,size)=>`<span class="av ${size}"><i style="font-style:normal">${esc(initials(n))}</i>`+
  `<img src="photos/${slug(n)}.jpg" alt="" loading="lazy" onerror="this.remove()"></span>`;
const esc=t=>String(t==null?"":t).replace(/[<>&"']/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c]));
let S=null,H=null,F=null,DM=null,offline=false;

/* ---------------- data ---------------- */
async function load(showToast){
  try{
    const [s,h,f,dm,c]=await Promise.all([
      fetch("standings.json?"+Date.now()).then(r=>r.ok?r.json():Promise.reject(r.status)),
      fetch("history.json?"+Date.now()).then(r=>r.ok?r.json():{entries:[]}).catch(()=>({entries:[]})),
      fetch("fixtures.json?"+Date.now()).then(r=>r.ok?r.json():{sports:{}}).catch(()=>({sports:{}})),
      fetch("demerits.json?"+Date.now()).then(r=>r.ok?r.json():{losses:[]}).catch(()=>({losses:[]})),
      fetch("config.json?"+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    S=s;H=h;F=f;DM=dm;if(c)CFG=c;offline=false;
    checkBanter();
    if(showToast)toast("Updated");
  }catch(e){
    if(!S){V().innerHTML=`<div class="card"><b>Standings not published yet.</b><div class="lbl" style="margin-top:6px">The next scheduled run will create them.</div></div>`;return false}
    offline=true;toast("Offline — showing last update");
  }
  return true;
}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200)}

/* ---------------- helpers ---------------- */
const LIVE=s=>s.source.startsWith("feed")||s.source.startsWith("override")||s.source==="confirmed";
const FINAL=s=>s.source==="confirmed";
const sportOrder=()=>Object.entries(S.sports).sort((a,b)=>(a[1].start||"").localeCompare(b[1].start||""));
const shortName=n=>n.split(" (")[0];
function ago(iso){
  const m=Math.max(0,(Date.now()-new Date(iso))/6e4);
  if(m<1)return "just now"; if(m<60)return Math.round(m)+"m ago";
  const h=m/60; if(h<24)return Math.round(h)+"h ago";
  return Math.round(h/24)+"d ago";
}
// every scored pick, with its value against the draft slot it cost
function scoredRows(){
  const out=[];
  for(const [k,s] of sportOrder()){
    if(!LIVE(s))continue;
    const ranked=s.rows.filter(r=>r.points!=null);
    ranked.forEach((r,i)=>{ if(r.drafted!=null) out.push({...r,key:k,comp:shortName(s.name),final:FINAL(s),
      placing:i+1,value:r.points-(12-r.drafted)}); });
  }
  return out;
}
// per-drafter aggregates across everything that is scoring
function profiles(){
  const P={};
  for(const d of S.drafters)P[d]={drafter:d,picks:[],pts:0,val:0,wins:0,podium:0,placings:[]};
  for(const r of scoredRows()){
    const p=P[r.drafter];if(!p)continue;
    p.picks.push(r);p.pts+=r.points+(r.bonus||0);p.val+=r.value;p.placings.push(r.placing);
    if(r.placing===1)p.wins++; if(r.placing<=3)p.podium++;
  }
  for(const d in P){
    const p=P[d],n=p.placings.length;
    p.avgPlace=n?p.placings.reduce((a,b)=>a+b,0)/n:null;
    p.avgPts=n?p.pts/n:null;
    p.best=p.picks.length?p.picks.reduce((a,b)=>b.points>a.points?b:a):null;
    p.worst=p.picks.length?p.picks.reduce((a,b)=>b.points<a.points?b:a):null;
    p.sd=n>1?Math.sqrt(p.placings.reduce((a,b)=>a+(b-p.avgPlace)**2,0)/n):null;
  }
  return P;
}
const ladderOf=e=>Object.fromEntries(e.ladder.map(r=>[r.d,r]));
function movement(){ // position change since the previous daily snapshot
  const es=(H&&H.entries)||[];if(es.length<2)return {};
  const now=ladderOf(es[es.length-1]),prev=ladderOf(es[es.length-2]),out={};
  for(const d in now) if(prev[d]) out[d]=prev[d].p-now[d].p;
  return out;
}

/* ---------------- routing ---------------- */
const routes={ladder:renderLadder,banter:renderBanter,stats:renderStats,fix:renderFixtures,comps:renderComps,me:renderDrafters,demerits:renderDemerits};
function go(hash){ if(location.hash===hash)render(); else location.hash=hash; }
let lastView=null;
function render(){
  if(!S)return;
  const live=Object.values(S.sports).filter(LIVE).length;
  $("sub").innerHTML=`<span class="dot ${offline?"off":""}"></span><span>${offline?"offline · ":""}updated ${ago(S.generated)}</span><span>·</span><span>${live}/20 scoring</span>`;
  const h=(location.hash||"#ladder").slice(1),[base,arg]=h.split("/");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",
    b.dataset.go===base||(base==="comp"&&b.dataset.go==="comps")||(base==="d"&&b.dataset.go==="me")));
  // a background re-render of the view already on screen (live scores, the 10-minute
  // refresh) keeps its place — only actual navigation starts at the top
  const y=h===lastView?window.scrollY:0;
  lastView=h;
  if(base==="comp")renderComp(decodeURIComponent(arg||""));
  else if(base==="d")renderDrafter(decodeURIComponent(arg||""));
  else (routes[base]||renderLadder)();
  window.scrollTo(0,y);
}

/* ---------------- ladder ---------------- */
function renderLadder(){
  const mv=movement(),lead=S.ladder[0].total||1,P=profiles();
  const top=S.ladder.slice(0,3),medal=["🥇","🥈","🥉"];
  V().innerHTML=`
  <div class="card"><div class="h">The podium</div>
    <div class="tiles">${top.map((r,i)=>`<div class="tile tap" style="text-align:center" onclick="go('#d/${encodeURIComponent(r.drafter)}')">
      ${avatar(r.drafter,"m")}<b style="margin-top:6px">${medal[i]} ${r.total}</b><span>${esc(r.drafter)}</span></div>`).join("")}</div>
  </div>
  <div class="card"><div class="h">Full ladder</div>
    ${S.ladder.map(r=>{const m=mv[r.drafter],ar=m>0?`<span class="up">▲${m}</span>`:m<0?`<span class="down">▼${-m}</span>`:`<span class="flat">–</span>`;
      return `<div class="row tap" onclick="go('#d/${encodeURIComponent(r.drafter)}')">
        <div class="pos">${r.pos}</div>${avatar(r.drafter,"s")}
        <div class="grow"><div class="nm">${esc(r.drafter)}</div>
          <div class="lbl">${r.confirmed} confirmed · ${r.inplay} in play${P[r.drafter].wins?` · ${P[r.drafter].wins} comp win${P[r.drafter].wins>1?"s":""}`:""}</div>
          <div class="bar"><i style="width:${(r.confirmed/lead*100).toFixed(1)}%;background:var(--green)"></i><i style="width:${(r.inplay/lead*100).toFixed(1)}%;background:var(--amber)"></i></div>
        </div>
        <div class="mv">${ar}</div><div class="tot">${r.total}</div></div>`}).join("")}
    <div class="legend"><span><b style="background:var(--green)"></b>confirmed</span><span><b style="background:var(--amber)"></b>in play</span><span>▲▼ since yesterday</span></div>
  </div>
  <div class="card"><div class="h">Scoring rules</div>
    <div class="lbl">11 points for first in a competition down to 1 for last, +2 for winning it. Confirmed points are locked; in-play points move every day.</div></div>`;
}

/* ---------------- stats ---------------- */
function renderStats(){
  const rows=scoredRows(),P=profiles(),lad=S.ladder;
  const left=20-Math.max(...lad.map(r=>r.scored)),come=left*11;
  const max=Math.max(...lad.map(r=>r.total))+come||1,w=v=>(v/max*100).toFixed(1)+"%";
  const nextUp=sportOrder().filter(([,s])=>!LIVE(s)).slice(0,3);
  let html=`<div class="card"><div class="h">Season pulse</div><div class="tiles four">
    <div class="tile"><b>${20-left}</b><span>comps scoring</span></div>
    <div class="tile"><b>${rows.length}</b><span>picks scored</span></div>
    <div class="tile"><b>${lad[0].total-lad[lad.length-1].total}</b><span>top to bottom</span></div>
    <div class="tile"><b>${come}</b><span>still on table</span></div></div></div>`;

  if(rows.length){
    const steal=rows.reduce((a,b)=>b.value>a.value?b:a),bust=rows.reduce((a,b)=>b.value<a.value?b:a);
    const line=(r,c,s)=>`<div class="row tap" onclick="go('#comp/${r.key}')"><div class="grow">
      <div class="nm">${esc(r.drafter)} — ${esc(r.pick)}</div>
      <div class="lbl">${esc(r.comp)} · pick #${r.drafted} · ${r.points} pts</div></div>
      <div class="tot" style="color:${c}">${s}${r.value}</div></div>`;
    html+=`<div class="card"><div class="h">Steal &amp; bust of the season</div>
      ${line(steal,"var(--green)",steal.value>0?"+":"")}${line(bust,"var(--red)",bust.value>0?"+":"")}
      <div class="lbl" style="margin-top:8px">Points scored against what that draft slot should return (#1 → 11, #11 → 1).</div></div>`;

    // draft value leaderboard
    const dv=Object.values(P).filter(p=>p.picks.length).sort((a,b)=>b.val-a.val);
    const span=Math.max(1,...dv.map(p=>Math.abs(p.val)));
    html+=`<div class="card"><div class="h">Best drafters (points above par)</div>
      ${dv.map(p=>`<div class="row tap" onclick="go('#d/${encodeURIComponent(p.drafter)}')">
        <div class="grow"><div class="nm">${esc(p.drafter)}</div>
        <div class="bar" style="background:none"><i style="width:${(Math.abs(p.val)/span*50).toFixed(1)}%;margin-left:${p.val<0?(50-Math.abs(p.val)/span*50).toFixed(1):50}%;background:${p.val<0?"var(--red)":"var(--green)"}"></i></div></div>
        <div class="tot" style="color:${p.val<0?"var(--red)":p.val>0?"var(--green)":"var(--mute)"}">${p.val>0?"+":""}${p.val}</div></div>`).join("")}
      <div class="lbl" style="margin-top:8px">Every pick judged against its draft slot, added up. Positive means they beat the board.</div></div>`;

    // wins & podiums
    const wp=Object.values(P).filter(p=>p.picks.length).sort((a,b)=>b.wins-a.wins||b.podium-a.podium||a.avgPlace-b.avgPlace);
    html+=`<div class="card"><div class="h">Comp wins &amp; podiums</div>
      <table><thead><tr><th>Drafter</th><th class="n">Wins</th><th class="n">Top 3</th><th class="n">Avg place</th><th class="n">Avg pts</th></tr></thead>
      <tbody>${wp.map(p=>`<tr class="tap" onclick="go('#d/${encodeURIComponent(p.drafter)}')"><td><b>${esc(p.drafter)}</b></td>
        <td class="n">${p.wins}</td><td class="n">${p.podium}</td><td class="n">${p.avgPlace.toFixed(1)}</td><td class="n">${p.avgPts.toFixed(1)}</td></tr>`).join("")}</tbody></table>
      <div class="lbl" style="margin-top:8px">Placing is where their pick sits among the 11 drafters in that competition.</div></div>`;
  }

  html+=`<div class="card"><div class="h">Points up for grabs</div>
    <div class="lbl" style="margin:-4px 0 10px">${left} of 20 competitions still to come — up to <b style="color:var(--ink)">${come}</b> points each still on the table.</div>
    ${lad.map(r=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;gap:8px">
      <b>${esc(r.drafter)}</b><span class="lbl">${r.confirmed} confirmed · ${r.inplay} in play</span></div>
      <div class="bar" style="height:11px;border-radius:6px"><i style="width:${w(r.confirmed)};background:var(--green)"></i><i style="width:${w(r.inplay)};background:var(--amber)"></i><i style="width:${w(max-r.total)};background:#22304d"></i></div></div>`).join("")}
    <div class="legend"><span><b style="background:var(--green)"></b>confirmed</span><span><b style="background:var(--amber)"></b>in play</span><span><b style="background:#22304d"></b>still to come</span></div></div>`;

  html+=scatterCard(rows);
  if(nextUp.length)html+=`<div class="card"><div class="h">Next off the rank</div>
    ${nextUp.map(([k,s])=>`<div class="row tap" onclick="go('#comp/${k}')"><div class="grow">
      <div class="nm">${esc(shortName(s.name))}</div><div class="lbl">${esc(s.window)}</div></div>
      <span class="chip">soon</span></div>`).join("")}</div>`;
  html+=demeritLink();
  V().innerHTML=html;
}
function scatterCard(rows){
  const head=`<div class="card"><div class="h">Did drafting early help?</div>`;
  if(rows.length<3)return head+`<div class="lbl">Needs a few more scored competitions before the pattern means anything.</div></div>`;
  const W=320,Hh=190,L=26,B=22,T=8,R=8;
  const maxY=Math.max(12,...rows.map(r=>r.points));
  const x=d=>L+(d-1)/10*(W-L-R),y=p=>Hh-B-(p/maxY)*(Hh-B-T);
  const n=rows.length,sx=rows.reduce((a,r)=>a+r.drafted,0),sy=rows.reduce((a,r)=>a+r.points,0),
    sxy=rows.reduce((a,r)=>a+r.drafted*r.points,0),sxx=rows.reduce((a,r)=>a+r.drafted*r.drafted,0),
    den=n*sxx-sx*sx,m=den?(n*sxy-sx*sy)/den:0,c=(sy-m*sx)/n,cl=v=>Math.max(0,Math.min(maxY,v));
  const grid=[0,Math.round(maxY/2),maxY].map(p=>`<line x1="${L}" y1="${y(p).toFixed(1)}" x2="${W-R}" y2="${y(p).toFixed(1)}" stroke="var(--line)" stroke-width=".5"/><text x="${L-5}" y="${(y(p)+3).toFixed(1)}" fill="var(--mute)" font-size="9" text-anchor="end">${p}</text>`).join("");
  const xt=[1,3,5,7,9,11].map(d=>`<text x="${x(d).toFixed(1)}" y="${Hh-7}" fill="var(--mute)" font-size="9" text-anchor="middle">${d}</text>`).join("");
  const dots=rows.map(r=>`<circle cx="${x(r.drafted).toFixed(1)}" cy="${y(r.points).toFixed(1)}" r="3.6" fill="var(--amber)" opacity=".85"><title>${esc(r.drafter)} — ${esc(r.pick)} (${esc(r.comp)}): pick #${r.drafted}, ${r.points} pts</title></circle>`).join("");
  const trend=`<line x1="${x(1)}" y1="${y(cl(m+c)).toFixed(1)}" x2="${x(11)}" y2="${y(cl(m*11+c)).toFixed(1)}" stroke="var(--green)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  const verdict=m<-0.15?"Early picks are paying off — the board ran roughly to form.":m>0.15?"The late picks are winning. So much for draft-night homework.":"Draft position has counted for nothing so far.";
  return head+`<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Draft slot against points scored">${grid}${xt}${trend}${dots}</svg>
    <div class="lbl">Draft slot within a competition (left = picked first) against points scored. ${verdict}</div></div>`;
}

let fxFilter="all";
function dayLabel(iso){
  const d=new Date(iso),now=new Date();
  const diff=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())
    -new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
  const date=d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"short"});
  return diff===0?"Today":diff===1?"Tomorrow":diff===-1?"Yesterday":date;
}
function allFixtures(){
  const out=[];
  if(!F||!F.sports)return out;
  for(const [k,s] of sportOrder()){
    for(const g of ((F.sports[k]||{}).games||[])){
      out.push({key:k,comp:shortName(s.name),when:g.d,h2h:!!(g.hd&&g.ad),
                st:g.st||"pre",hs:g.hs,as:g.as,dt:g.t,
                home:{team:pickOf(k,g.hd)||g.h,owner:g.hd,score:g.hs},
                away:{team:pickOf(k,g.ad)||g.a,owner:g.ad,score:g.as}});
    }
  }
  return out.sort((a,b)=>a.when.localeCompare(b.when));
}
function renderFixtures(){
  const all=allFixtures();

    <div class="lbl">Nothing scheduled yet — the competitions with live feeds haven't started.</div></div>`;return}
  const upcoming=all.filter(x=>x.st!=="post"),results=all.filter(x=>x.st==="post");
  const h2h=upcoming.filter(x=>x.h2h).length;
  if(fxFilter==="res"&&!results.length)fxFilter="all";
  const rows=fxFilter==="res"?results.slice().reverse()       // results read newest first
    :fxFilter==="h2h"?upcoming.filter(x=>x.h2h):upcoming;
  const groups=[];
  for(const r of rows){
    const key=new Date(r.when).toDateString();
    let g=groups.find(x=>x.key===key);
    if(!g){g={key,label:dayLabel(r.when),items:[]};groups.push(g)}
    g.items.push(r);
  }
  // in a result, colour each owner by how their team went; before and during, just their colour
  const outcome=(x,mine,theirs)=>x.st!=="post"?null:Number(mine.score)-Number(theirs.score);
  const side=(s,res)=>s.owner?`<span style="color:${res==null||isNaN(res)?"var(--amber)":res>0?"var(--green)":res<0?"var(--red)":"var(--mute)"}">${esc(s.owner)}</span>`
    :`<span class="lbl">undrafted</span>`;
  const title=x=>x.st==="pre"
    ?`${esc(x.home.team)} <span style="color:var(--mute);font-weight:400">v</span> ${esc(x.away.team)}`
    :`${esc(x.home.team)} <b>${esc(x.hs??"–")}–${esc(x.as??"–")}</b> ${esc(x.away.team)}`;
  const chip=x=>x.st==="in"?`<span class="chip live">${esc(x.dt||"live")}</span>`
    :x.st==="post"?`<span class="chip final">${esc(x.dt||"final")}</span>`
    :x.h2h?`<span class="chip" style="color:var(--amber);border-color:rgba(255,194,26,.35)">H2H</span>`:"";
  V().innerHTML=`<div class="seg">
      <button class="${fxFilter==="all"?"on":""}" onclick="fxFilter='all';render();scrollTo(0,0)">Upcoming (${upcoming.length})</button>
      <button class="${fxFilter==="h2h"?"on":""}" onclick="fxFilter='h2h';render();scrollTo(0,0)">Head to head (${h2h})</button>
      ${results.length?`<button class="${fxFilter==="res"?"on":""}" onclick="fxFilter='res';render();scrollTo(0,0)">Results (${results.length})</button>`:""}
    </div>
    <div class="lbl" style="margin:-2px 0 10px">${fxFilter==="res"
      ?`Every result for a drafted team from the last ${F.past||7} days. Green owner won, red lost.`
      :`Every game a drafted team plays in the next ${F.days||21} days. Live scores update while you watch.`}</div>
    ${groups.map(g=>`<div class="card"><div class="h">${esc(g.label)}</div>
      ${g.items.map(x=>`<div class="row tap" onclick="go('#comp/${x.key}')"><div class="grow">
        <div class="nm">${title(x)}</div>
        <div class="lbl">${esc(x.comp)} · ${new Date(x.when).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})} · ${side(x.home,outcome(x,x.home,x.away))} v ${side(x.away,outcome(x,x.away,x.home))}</div>
      </div>${chip(x)}</div>`).join("")}

/* live scores: while fixtures or a drafter page is open, overlay ESPN's own scoreboard
   onto the games in fixtures.json, so scores move between the daily rebuilds. Games are
   matched by the event id the daily run bakes in; until a fixtures file has ids, the same
   two teams at the same kick-off is the match, and the scoreboard paths below stand in
   (they mirror utc/sports.py) — so live scores work even on a fixtures file from before
   this feature. If ESPN can't be reached the baked-in scores simply stand. */
const FXPATH={epl:"soccer/eng.1",bund:"soccer/ger.1",ncaa:"football/college-football",nfl:"football/nfl",
  ucl:"soccer/uefa.champions",nhl:"hockey/nhl",nba:"basketball/nba",mlb:"baseball/mlb"};
let liveBusy=false,liveLast=0;
async function refreshLive(force){
  if(!F||!F.sports||liveBusy)return;
  if(!force&&Date.now()-liveLast<45e3)return;       // at most one sweep per ~minute
  const now=Date.now();
  const need=Object.entries(F.sports).map(([k,s])=>[s,s.path||FXPATH[k]])
    .filter(([s,path])=>path&&(s.games||[]).some(g=>{
      if(g.st==="in")return true;                   // mid-game: always worth a look
      if(g.st==="post")return false;
      const t=new Date(g.d).getTime();              // starts within the hour, or should have
      return t-now<36e5&&now-t<12*36e5;             // started less than 12h ago
    }));
  if(!need.length)return;
  liveBusy=true;liveLast=now;
  const f=t=>new Date(t).toISOString().slice(0,10).replace(/-/g,"");
  let changed=false;
  await Promise.all(need.map(async([s,path])=>{
    try{
      const r=await fetch(`https://site.web.api.espn.com/apis/site/v2/sports/${path}/scoreboard?dates=${f(now-864e5)}-${f(now+864e5)}`);
      if(!r.ok)return;
      for(const ev of ((await r.json()).events||[])){
        const comp=(ev.competitions||[{}])[0],ty=((comp.status||ev.status||{}).type)||{};
        if(ty.state!=="in"&&ty.state!=="post")continue;
        let hs,as,hn,an;
        for(const c of comp.competitors||[]){
          const nm=(c.team||{}).displayName;
          if(c.homeAway==="home"){hs=c.score;hn=nm} else if(c.homeAway==="away"){as=c.score;an=nm}
        }
        const g=s.games.find(x=>x.i&&x.i===ev.id)||s.games.find(x=>!x.i&&x.h===hn&&x.a===an&&
          Math.abs(new Date(x.d)-new Date(ev.date))<36e5);   // kick-off match: safe for doubleheaders
        if(!g)continue;
        const t=ty.shortDetail||"";
        if(g.st!==ty.state||g.hs!==hs||g.as!==as||g.t!==t){
          g.st=ty.state;g.hs=hs;g.as=as;g.t=t;changed=true;
        }
      }
    }catch(e){}
  }));
  liveBusy=false;
  const base=(location.hash||"#ladder").slice(1).split("/")[0];
  if(changed&&(base==="fix"||base==="d"))render();
}

// next game for each of a drafter's picks, with who owns the opponent
const pickOf=(key,drafter)=>{
  if(!drafter)return null;
  const r=(S.sports[key]||{rows:[]}).rows.find(x=>x.drafter===drafter);
  return r?r.pick:null;
};
function lookAhead(name){
  const out=[];
  if(!F||!F.sports)return out;
  for(const [k,s] of sportOrder()){
    const fs=F.sports[k];
    if(!fs||!fs.games)continue;
    for(const g of fs.games){
      if(g.st==="post")continue;   // results live in the fixtures file too — not "next"
      const home=g.hd===name,away=g.ad===name;
      if(!home&&!away)continue;
      const owner=home?g.ad:g.hd;
      // show drafted teams by their draft-board name, so it reads like the rest of the app
      out.push({comp:shortName(s.name),key:k,when:g.d,home,owner,live:g.st==="in",
                ms:home?g.hs:g.as,os:home?g.as:g.hs,dt:g.t,
                mine:pickOf(k,name)||(home?g.h:g.a),
                opp:pickOf(k,owner)||(home?g.a:g.h)});
      break;                       // just the next one per competition
    }
  }
  return out.sort((a,b)=>a.when.localeCompare(b.when));
}
function whenLabel(iso){
  const d=new Date(iso),now=new Date();
  const day=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff=Math.round((day-t0)/864e5);
  const date=d.toLocaleDateString(undefined,{day:"numeric",month:"short"});
  const time=d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  if(diff===0)return `today, ${time}`;
  if(diff===1)return `tomorrow, ${time}`;
  if(diff<7)return `${d.toLocaleDateString(undefined,{weekday:"long"})}, ${date}`;
  return date;
}
function lookAheadCard(name){
  const g=lookAhead(name);
  if(!g.length)return `<div class="card"><div class="h">Next up</div>
    <div class="lbl">No fixtures in the next three weeks — the competitions with feeds haven't started yet.</div></div>`;
  return `<div class="card"><div class="h">Next up</div>
    ${g.map(x=>`<div class="row tap" onclick="go('#comp/${x.key}')"><div class="grow">
      <div class="nm">${x.live?`${esc(x.mine)} <b>${esc(x.ms??"–")}–${esc(x.os??"–")}</b> ${esc(x.opp)}`
        :`${esc(x.mine)} <span style="color:var(--mute);font-weight:400">${x.home?"vs":"at"}</span> ${esc(x.opp)}`}</div>
      <div class="lbl">${esc(x.comp)} · ${x.live?`live now${x.dt?` · ${esc(x.dt)}`:""}`:whenLabel(x.when)} · ${x.owner?`${esc(x.owner)}'s team`:"undrafted"}</div></div>
      ${x.live?`<span class="chip live">live</span>`
        :x.owner?`<span class="chip" style="color:var(--amber);border-color:rgba(255,194,26,.35)">head to head</span>`:`<span class="chip">free hit</span>`}
    </div>`).join("")}
    <div class="lbl" style="margin-top:8px">Your pick's next game in each competition. "Head to head" means another drafter owns the opponent.</div></div>`;
}
function sparkline(name){
  const es=(H&&H.entries)||[];
  if(es.length<2)return `<div class="lbl" style="margin-top:12px">Position history builds up as the season runs.</div>`;
  const pts=es.map(e=>{const r=e.ladder.find(x=>x.d===name);return r?r.p:null}).filter(v=>v!=null);
  if(pts.length<2)return "";
  const W=300,Hh=44,n=pts.length;
  const x=i=>i/(n-1)*W,y=v=>4+((v-1)/10)*(Hh-8); // position 1 at top
  const d=pts.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" aria-label="Ladder position over time">
    <path d="${d}" fill="none" stroke="var(--amber)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(n-1).toFixed(1)}" cy="${y(pts[n-1]).toFixed(1)}" r="3" fill="var(--amber)"/></svg>
    <div class="lbl">Ladder position over ${n} days (top = 1st).</div>`;
}

/* ---------------- banter ---------------- */
// The wall lives in a free Firestore project, reached straight over REST — no SDK,
// no login. Until the commissioner fills in config.json the tab explains itself.
let CFG=null,pendingRe="",wallNewest="";
const PLACEHOLDER="Sledge, gloat, dispute the feeds…";
const myName=()=>localStorage.getItem("utcName")||"";
const fsReady=()=>!!(CFG&&CFG.firebase&&CFG.firebase.projectId&&CFG.firebase.apiKey);
const fsURL=p=>`https://firestore.googleapis.com/v1/${p.startsWith("projects/")?p
  :`projects/${CFG.firebase.projectId}/databases/(default)/documents${p}`}?key=${CFG.firebase.apiKey}`;
async function fetchMsgs(limit){
  const r=await fetch(fsURL(":runQuery"),{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({structuredQuery:{from:[{collectionId:"messages"}],
      orderBy:[{field:{fieldPath:"t"},direction:"DESCENDING"}],limit}})});
  if(!r.ok)throw r.status;
  return (await r.json()).filter(x=>x.document).map(x=>{
    const f=x.document.fields||{},g=k=>(f[k]||{}).stringValue||(f[k]||{}).timestampValue||"";
    return {id:x.document.name.split("/").pop(),n:g("n"),x:g("x"),re:g("re"),t:g("t")}});
}
// Reactions get their own collection, one document per (message, person, emoji). The wall
// stays append-only, and nothing here writes to /messages, so no reaction fires a push.
const REAX=["👍","😂","🔥","💀","🤡"];
let WALLRX={};
async function fetchReax(){
  const r=await fetch(fsURL(":runQuery"),{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({structuredQuery:{from:[{collectionId:"reax"}],limit:500}})});
  if(!r.ok)throw r.status;
  return (await r.json()).filter(x=>x.document).map(x=>{
    const f=x.document.fields||{},g=k=>(f[k]||{}).stringValue||"";
    return {path:x.document.name,m:g("m"),n:g("n"),e:g("e")}});
}
function reaxBar(mid,rx){
  // names under the buttons, not just counts — hover tooltips don't exist on a phone,
  // and knowing exactly who dropped the clown on you is where the banter lives
  const by={};
  rx.forEach(r=>{(by[r.e]=by[r.e]||[]).push(r.n)});
  const names=REAX.filter(e=>by[e]).map(e=>`${e} ${by[e].map(esc).join(", ")}`).join(" · ");
  return `<div class="reaxwrap" data-m="${esc(mid)}"><div class="reax">${REAX.map(e=>{
    const hit=rx.filter(r=>r.e===e),on=hit.some(r=>r.n===myName());
    return `<button class="rx${on?" on":hit.length?" has":""}" onclick="toggleReax('${esc(mid)}','${e}',this)">${e}${hit.length?`<i>${hit.length}</i>`:""}</button>`
  }).join("")}</div>${names?`<div class="lbl" style="margin-top:4px;font-size:11px">${names}</div>`:""}</div>`;
}
function paintReax(mid){
  const el=document.querySelector(`.reaxwrap[data-m="${CSS.escape(mid)}"]`);
  if(el)el.outerHTML=reaxBar(mid,WALLRX[mid]||[]);
}
async function toggleReax(mid,e,btn){
  if(!myName()){toast("Pick your name on the wall first");return}
  const mine=(WALLRX[mid]||[]).find(r=>r.e===e&&r.n===myName());
  btn.disabled=true;
  try{
    if(mine){
      const r=await fetch(fsURL(mine.path),{method:"DELETE"});if(!r.ok)throw r.status;
      WALLRX[mid]=WALLRX[mid].filter(x=>x!==mine);
    }else{
      const r=await fetch(fsURL("/reax"),{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({fields:{m:{stringValue:mid},n:{stringValue:myName()},e:{stringValue:e},
          t:{timestampValue:new Date().toISOString()}}})});
      if(!r.ok)throw r.status;
      (WALLRX[mid]=WALLRX[mid]||[]).push({path:(await r.json()).name,m:mid,n:myName(),e});
    }
    paintReax(mid);            // the old button is replaced, so it needs no re-enabling
  }catch(err){toast("Reaction didn't stick — try again");btn.disabled=false}
}
function navDot(on){
  const b=document.querySelector('nav button[data-go="banter"]');if(!b)return;
  const d=b.querySelector(".ndot");
  if(on&&!d)b.insertAdjacentHTML("beforeend",'<i class="ndot"></i>'); else if(!on&&d)d.remove();
}
async function checkBanter(){ // one-document peek so the nav can show an unread dot cheaply
  if(!fsReady())return;
  try{const m=await fetchMsgs(1);
    if(m.length){wallNewest=m[0].t;navDot(wallNewest>(localStorage.getItem("utcSeen")||""))}}catch(e){}
}
function setRe(d,btn){
  pendingRe=d;
  document.querySelectorAll("#reRow button").forEach(b=>b.classList.toggle("on",b===btn));
  $("msg").placeholder=d?`Give it to ${d}…`:PLACEHOLDER;$("msg").focus();
}
function renderBanter(){
  if(!fsReady()){V().innerHTML=`<div class="card"><div class="h">Banter</div>
    <b>Not switched on yet.</b>
    <div class="lbl" style="margin-top:6px">One 10-minute job for the commissioner (README, “Switch on banter &amp; notifications”) and this tab becomes the group's wall — comment on anyone's performance, cop it back, and get new posts and the Tuesday wrap as phone notifications instead of waiting on WhatsApp.</div></div>`;return}
  if(!myName()){
    V().innerHTML=`<div class="card"><div class="h">Who are you?</div>
      <div class="lbl" style="margin-bottom:10px">Once per phone — posts go up under your name. Honour system, like the rest of the comp.</div>
      <div class="tiles">${S.drafters.map(d=>`<div class="tile tap" style="text-align:center" onclick="localStorage.setItem('utcName','${esc(d)}');renameSub();render()">
        ${avatar(d,"m")}<span style="display:block;margin-top:6px;font-size:13px">${esc(d)}</span></div>`).join("")}</div></div>`;return}
  V().innerHTML=`${pushCard()}
  <div class="card"><div class="h">Say it to the group</div>
    <div class="lbl" style="margin-bottom:8px">Posting as <b style="color:var(--ink)">${esc(myName())}</b> · <span style="text-decoration:underline;cursor:pointer" onclick="localStorage.removeItem('utcName');render()">not you?</span></div>
    <div class="seg" id="reRow" style="padding-bottom:8px">${["",...S.drafters.filter(d=>d!==myName())].map(d=>
      `<button class="${pendingRe===d?"on":""}" onclick="setRe('${esc(d)}',this)">${d?esc(d):"General"}</button>`).join("")}</div>
    <textarea class="search" id="msg" rows="2" maxlength="400" placeholder="${pendingRe?`Give it to ${esc(pendingRe)}…`:PLACEHOLDER}"></textarea>
    <button class="btn" id="post">Post</button></div>
  <div class="card"><div class="h">The wall</div><div id="wall">
    <div class="skel" style="width:70%"></div><div class="skel" style="width:50%;margin-top:10px"></div></div></div>`;
  $("post").onclick=postMsg;
  drawWall();
}
async function drawWall(){
  const w=()=>$("wall");
  try{
    const [msgs,rx]=await Promise.all([fetchMsgs(60),fetchReax().catch(()=>[])]);
    WALLRX={};rx.forEach(r=>(WALLRX[r.m]=WALLRX[r.m]||[]).push(r));
    if(msgs.length){wallNewest=msgs[0].t;localStorage.setItem("utcSeen",wallNewest)}
    navDot(false);
    if(!w())return;
    w().innerHTML=msgs.length?msgs.map(m=>`<div class="row" style="align-items:flex-start">${avatar(m.n,"s")}
      <div class="grow"><div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><span class="nm">${esc(m.n)}</span>
        ${m.re?`<span class="chip" style="color:var(--amber);border-color:rgba(255,194,26,.35)">→ ${esc(m.re)}</span>`:""}
        <span class="lbl">${ago(m.t)}</span></div>
        <div style="margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere">${esc(m.x)}</div>
        ${reaxBar(m.id,WALLRX[m.id]||[])}</div></div>`).join("")
      :`<div class="lbl">Nothing yet. Someone's pick is going badly — say something about it.</div>`;
  }catch(e){if(w())w().innerHTML=`<div class="lbl">Couldn't reach the wall${offline?" — offline":""}. Tap ⟳ to retry.</div>`}
}
async function postMsg(){
  const x=$("msg").value.trim();
  if(!x)return;
  $("post").disabled=true;
  try{
    const fields={n:{stringValue:myName()},x:{stringValue:x},t:{timestampValue:new Date().toISOString()}};
    if(pendingRe)fields.re={stringValue:pendingRe};
    const r=await fetch(fsURL("/messages"),{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({fields})});
    if(!r.ok)throw r.status;
    pendingRe="";toast("On the wall");renderBanter();
  }catch(e){toast("Didn't post — try again");$("post").disabled=false}
}
/* push notifications: plain web push, sent by the GitHub workflows */
function pushCard(){
  if(!CFG.vapidPublicKey)return "";
  const ok="serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
  const on=ok&&Notification.permission==="granted"&&!!localStorage.getItem("utcSub");
  const inner=on?`<div class="lbl">On — new banter and the Tuesday wrap land on this phone. No more waiting for the WhatsApp message.</div>
      <button class="chip" style="margin-top:9px" onclick="pushOff()">Turn off</button>`
    :ok?`<div class="lbl">Get new banter and the Tuesday wrap as notifications on this phone, instead of via WhatsApp.</div>
      <button class="btn" style="margin-top:9px" onclick="pushOn()">Turn on notifications</button>`
    :`<div class="lbl">This browser can't do app notifications. iPhone: open the site in Safari, Share → <b>Add to Home Screen</b>, then open the installed app and flick them on here (needs iOS 16.4+).</div>`;
  return `<div class="card"><div class="h">Notifications</div>${inner}</div>`;
}
const b64u8=s=>{const b=atob((s+"=".repeat((4-s.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/"));
  return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function pushOn(){
  try{
    if(await Notification.requestPermission()!=="granted"){toast("Blocked — allow notifications in settings");return}
    const reg=await navigator.serviceWorker.ready;
    // A subscription left over from an older VAPID key makes subscribe() throw
    // InvalidStateError, and retrying never clears it — drop it first if the key moved on.
    const want=b64u8(CFG.vapidPublicKey);
    const stale=await reg.pushManager.getSubscription();
    if(stale){const had=new Uint8Array(stale.options.applicationServerKey||new ArrayBuffer(0));
      if(had.length!==want.length||!had.every((b,i)=>b===want[i]))await stale.unsubscribe()}
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:want});
    const r=await fetch(fsURL("/subs"),{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({fields:{sub:{stringValue:JSON.stringify(sub)},
        n:{stringValue:myName()},t:{timestampValue:new Date().toISOString()}}})});
    if(!r.ok)throw r.status;
    localStorage.setItem("utcSub",(await r.json()).name);
    toast("Notifications on");render();
  }catch(e){toast("Couldn't switch them on — try again")}
}
// The notifiers skip the phone that wrote a message by the name on its subscription,
// and /subs docs can't be edited (rules) — so when this phone changes hands, re-register
// the same push subscription under the new name: create first, then drop the old doc.
async function renameSub(){
  const old=localStorage.getItem("utcSub");
  if(!old||!fsReady())return;
  try{
    const r=await fetch(fsURL(old));if(!r.ok)throw r.status;
    const f=(await r.json()).fields||{};
    if(!f.sub||((f.n||{}).stringValue||"")===myName())return;
    const r2=await fetch(fsURL("/subs"),{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({fields:{sub:f.sub,n:{stringValue:myName()},
        t:{timestampValue:new Date().toISOString()}}})});
    if(!r2.ok)throw r2.status;
    localStorage.setItem("utcSub",(await r2.json()).name);
    fetch(fsURL(old),{method:"DELETE"}).catch(()=>{});
  }catch(e){}
}
async function pushOff(){
  try{const s=await (await navigator.serviceWorker.ready).pushManager.getSubscription();if(s)await s.unsubscribe()}catch(e){}
  const nm=localStorage.getItem("utcSub");
  if(nm)fetch(fsURL(nm),{method:"DELETE"}).catch(()=>{});
  localStorage.removeItem("utcSub");toast("Notifications off");render();
}

/* ---------------- app wiring ---------------- */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go("#"+b.dataset.go));
addEventListener("hashchange",render);
$("refresh").onclick=async()=>{$("refresh").style.transform="rotate(360deg)";await load(true);render();
  setTimeout(()=>$("refresh").style.transform="",400)};
$("share").onclick=async()=>{
  const l=S?S.ladder[0]:null;
  const text=l?`UTC 2027 — ${l.drafter} leads on ${l.total}. Live table:`:"UTC 2027 live table:";
  const url=location.href.split("#")[0];
  try{ if(navigator.share) await navigator.share({title:"UTC 2027",text,url});
       else { await navigator.clipboard.writeText(text+" "+url); toast("Link copied"); } }
  catch(e){}
};
// live scores: while fixtures or a drafter page is on screen, sweep ESPN every minute
setInterval(()=>{ const base=(location.hash||"#ladder").slice(1).split("/")[0];
  if(!document.hidden&&(base==="fix"||base==="d"))refreshLive(); },6e4);
// refresh when the app comes back to the foreground, and every 10 minutes
let last=Date.now();
addEventListener("visibilitychange",async()=>{ if(!document.hidden&&Date.now()-last>6e4){await load();last=Date.now();render()} });
setInterval(async()=>{ if(!document.hidden){await load();last=Date.now();render()} },6e5);
addEventListener("online",async()=>{await load(true);render()});
addEventListener("offline",()=>{offline=true;render()});
(async()=>{ if(await load())render(); })();
// reload once when a new service worker takes over, so app updates land without a manual clear
if("serviceWorker" in navigator){
  let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(!reloading&&navigator.serviceWorker.controller){reloading=true;location.reload()}
  });
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.update();
    setInterval(()=>reg.update(),36e5);
  }).catch(()=>{}));
}
