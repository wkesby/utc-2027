name: ESPN probe (temporary)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python - <<'PY'
          import json, urllib.request
          def get(u):
              r = urllib.request.Request(u, headers={"User-Agent": "utc-scoreboard/1.0"})
              return json.load(urllib.request.urlopen(r, timeout=30))
          for u in ["https://site.web.api.espn.com/apis/v2/sports/hockey/nhl/standings?season=2027&seasontype=2",
                    "https://site.web.api.espn.com/apis/v2/sports/hockey/nhl/standings?season=2027"]:
              print("=====", u)
              d = get(u)
              print("season:", d.get("season"), "| top keys:", list(d.keys()))
              def walk(n, depth=0):
                  if isinstance(n, dict):
                      if n.get("standings", {}).get("entries"):
                          print("  "*depth + f"group {n.get('name')!r}: {len(n['standings']['entries'])} entries")
                          for e in n["standings"]["entries"][:3]:
                              t = e.get("team", {})
                              st = {s.get("name"): (s.get("value"), s.get("displayValue")) for s in e.get("stats", [])}
                              print("  "*(depth+1) + f"{t.get('displayName')} (id {t.get('id')}): " + json.dumps(st))
                      for c in n.get("children", []): walk(c, depth+1)
              walk(d)
          import sys; sys.path.insert(0, ".")
          from feeds import espn
          tbl = espn.standings("hockey/nhl@2027")
          print("===== feeds.espn.standings('hockey/nhl@2027') ->", len(tbl), "teams")
          print(json.dumps(dict(sorted(tbl.items(), key=lambda kv: kv[1])), indent=0)[:1500])
          PY
