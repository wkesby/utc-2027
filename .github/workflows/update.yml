name: UTC standings
on:
  schedule:
    # Hourly — the ladder and fixture results follow the games through the day instead
    # of waiting for 4am. Minute 17 dodges GitHub's congested on-the-hour slot and never
    # coincides with the report crons below.
    - cron: "17 * * * *"
    # Weekly report: Tuesday 14:00 Melbourne. Cron is UTC-only and Melbourne moves with
    # daylight saving, so both candidate hours run and the step below keeps the right one.
    - cron: "0 3 * * 2"      # = Tue 14:00 AEDT (Oct–Apr)
    - cron: "0 4 * * 2"      # = Tue 14:00 AEST (Apr–Oct)
  workflow_dispatch:
    inputs:
      report:
        description: "Also build and send the weekly report (email + phone push)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: utc-standings       # hourly runs queue behind a slow report run, never race its push
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow pywebpush
      - name: Build standings
        run: python -m utc.engine
      - name: Weekly report slot? (Tue 2pm Melbourne, or a manual run that asks for it)
        id: slot
        run: |
          # Only the two dedicated report crons — or a manual run with the report box
          # ticked — can be the slot. The hourly cron also passes through Tue 2pm
          # Melbourne, and a plain manual run is just a standings/fixtures refresh:
          # neither may send the wrap, the email or the phone pushes.
          now=$(TZ=Australia/Melbourne date "+%u%H")   # day-of-week + hour, 214 = Tuesday 2pm
          sched="${{ github.event.schedule }}"
          if [ "${{ inputs.report }}" = "true" ] || { [ "$now" = "214" ] && [ "${{ github.event_name }}" = "schedule" ] && [ "$sched" != "17 * * * *" ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Melbourne $(TZ=Australia/Melbourne date '+%a %H:%M') — not the report slot, standings only."
          fi
      - name: Weekly report
        if: steps.slot.outputs.go == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m utc.report
      - name: Email the report with a WhatsApp share link
        if: steps.slot.outputs.go == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: python -m utc.send || echo "email not configured yet — report is still committed below"
      - name: Push the wrap to phones that opted in
        if: steps.slot.outputs.go == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python -m utc.notify report || echo "push not configured yet — see README"
      - name: Commit results
        run: |
          git config user.name "utc-bot" && git config user.email "utc-bot@users.noreply.github.com"
          git add docs && git commit -m "standings $(date -u '+%F %H:%M')" || echo "no change"
          git push
