name: UTC standings
on:
  schedule:
    # Hourly — the ladder and fixture results follow the games through the day instead
    # of waiting for 4am. Minute 17 dodges GitHub's congested on-the-hour slot and never
    # coincides with the report crons below.
    - cron: "17 * * * *"
    # Weekly report: Tuesday 14:00 Melbourne. Cron is UTC-only and Melbourne moves with
    # daylight saving, so both candidate hours are the on-time attempts — but GitHub runs
    # schedules hours late or skips them, so the slot step below lets any later scheduled
    # run (the hourly one included) send the wrap until it has gone out for the week.
    - cron: "0 3 * * 2"      # = Tue 14:00 AEDT (Oct–Apr)
    - cron: "0 4 * * 2"      # = Tue 14:00 AEST (Apr–Oct)
  workflow_dispatch:
    inputs:
      report:
        description: "Also build and send the weekly report (email + phone push)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: utc-standings       # hourly runs queue behind a slow report run, never race its push
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow pywebpush
      - name: Build standings
        run: python -m utc.engine
      - name: Trash talk (drafted team beaten by an undrafted one)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m utc.trashtalk || echo "trash talk skipped — the standings still ship"
      - name: Weekly report slot? (first scheduled run after Tue 2pm Melbourne, or a manual run that asks)
        id: slot
        run: |
          # The wrap can't wait for one exact cron: GitHub delivered the Tue 2pm run at
          # 3:55pm once and skipped it another week. So any scheduled run — the hourly
          # one included — sends it once it is Tuesday 2pm Melbourne or later and this
          # week's report isn't on disk yet. utc.report stamps its files with the UTC
          # date, and Tuesday afternoon Melbourne through to Wednesday morning is all
          # Tuesday in UTC, so "today's report exists" is exactly "already sent this
          # week" — one wrap a week, never two. A plain manual run stays a quiet
          # standings/fixtures refresh: only the ticked report box sends.
          stamp=$(date -u +%F)
          mel=$(TZ=Australia/Melbourne date "+%u%H")    # day-of-week + hour, 214 = Tue 2pm
          go=false
          if [ "${{ inputs.report }}" = "true" ]; then
            go=true
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" = "2" ] \
               && [ "$mel" -ge 214 ] && [ ! -e "docs/reports/$stamp.txt" ]; then
            go=true
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          if [ "$go" = "true" ]; then
            echo "Melbourne $(TZ=Australia/Melbourne date '+%a %H:%M') — sending this week's wrap."
          else
            echo "Melbourne $(TZ=Australia/Melbourne date '+%a %H:%M') — not the report slot, standings only."
          fi
      - name: Weekly report
        if: steps.slot.outputs.go == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m utc.report
      - name: Email the report with a WhatsApp share link
        if: steps.slot.outputs.go == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: python -m utc.send || echo "email not configured yet — report is still committed below"
      - name: Push the wrap to phones that opted in
        if: steps.slot.outputs.go == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python -m utc.notify report || echo "push not configured yet — see README"
      - name: Commit results
        run: |
          git config user.name "utc-bot" && git config user.email "utc-bot@users.noreply.github.com"
          git add docs && git commit -m "standings $(date -u '+%F %H:%M')" || echo "no change"
          git push
