name: UTC banter pings
# Every 5 minutes (GitHub's floor — queue jitter means real delivery is usually a few
# minutes): any new banter-wall messages go out as push notifications to the phones
# that switched them on. Exits harmlessly (and fast) until docs/config.json and the
# VAPID_PRIVATE_KEY secret are set up — see README.
# With the instant Cloud Function (functions/) deployed, this becomes a safety net:
# the function advances the shared meta/notify marker, so runs here only send what it
# missed and never duplicate it. Once instant delivery is confirmed, relax the cron
# below to hourly ("0 * * * *").
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pywebpush
      - name: Push new messages to phones
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python -m utc.notify banter
